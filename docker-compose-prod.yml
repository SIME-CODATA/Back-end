services:
  traefik:
    image: traefik:v3.1
    container_name: pdm_traefik
    restart: always
    command:
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.certificadofront.acme.caserver=${LE_ACME_URL}"
      - "--certificatesresolvers.certificadofront.acme.httpchallenge=true"
      - "--certificatesresolvers.certificadofront.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.certificadofront.acme.email=${LE_EMAIL}"
      - "--certificatesresolvers.certificadofront.acme.storage=/letsencrypt/acme.json"
    networks:
      - traefik-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:18-alpine
    container_name: pdm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pdm_postgres_data:/var/lib/postgresql
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: pdm-admin:backend
    container_name: pdm_app
    restart: always
    env_file:
      - .env
    environment:
      REFLEX_DB_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REFLEX_DEPLOY_URL: "https://${HOST_NAME}"
      REFLEX_API_URL: "https://${HOST_NAME}"
      REFLEX_FRONTEND_PATH: "/backend"
      REFLEX_BACKEND_PATH: "/backend"
      REFLEX_CORS_ALLOWED_ORIGINS: "https://${HOST_NAME}"
      REFLEX_USE_NPM: "1"
      ENFORCE_INSTITUTIONAL_EMAIL: "true"
      ALLOWED_EMAIL_DOMAINS: "${ALLOWED_EMAIL_DOMAINS:-prefeitura.sp.gov.br}"
      MEDIA_STORAGE_PATH: "/app/data/media"
      MEDIA_PUBLIC_PREFIX: "/backend"
      MEDIA_MAX_IMAGE_MB: "25"
      MEDIA_MAX_VIDEO_MB: "500"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traefik-net
      - db-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pdm_traefik_net"
      # CMS: /backend/*, incluindo WebSocket /backend/_event
      - "traefik.http.routers.pdm-admin.entrypoints=websecure"
      - "traefik.http.routers.pdm-admin.rule=Host(`${HOST_NAME}`) && (Path(`/backend`) || PathPrefix(`/backend/`))"
      - "traefik.http.routers.pdm-admin.priority=100"
      - "traefik.http.routers.pdm-admin.tls=true"
      - "traefik.http.routers.pdm-admin.tls.certresolver=certificadofront"
      - "traefik.http.routers.pdm-admin.service=pdm-service"
      # FastAPI publica: mantém /api/site/* sem roubar a raiz do domínio
      - "traefik.http.routers.pdm-site.entrypoints=websecure"
      - "traefik.http.routers.pdm-site.rule=Host(`${HOST_NAME}`) && (Path(`/api/site`) || PathPrefix(`/api/site/`))"
      - "traefik.http.routers.pdm-site.priority=150"
      - "traefik.http.routers.pdm-site.tls=true"
      - "traefik.http.routers.pdm-site.tls.certresolver=certificadofront"
      - "traefik.http.routers.pdm-site.service=pdm-service"
      # Banco de Mídia: /backend/api/media/* -> /api/media/* no FastAPI
      - "traefik.http.routers.pdm-media.entrypoints=websecure"
      - "traefik.http.routers.pdm-media.rule=Host(`${HOST_NAME}`) && (Path(`/backend/api/media`) || PathPrefix(`/backend/api/media/`))"
      - "traefik.http.routers.pdm-media.priority=200"
      - "traefik.http.routers.pdm-media.tls=true"
      - "traefik.http.routers.pdm-media.tls.certresolver=certificadofront"
      - "traefik.http.routers.pdm-media.service=pdm-service"
      - "traefik.http.routers.pdm-media.middlewares=pdm-strip-backend-media"
      - "traefik.http.middlewares.pdm-strip-backend-media.stripprefix.prefixes=/backend"
      - "traefik.http.services.pdm-service.loadbalancer.server.port=3000"
    volumes:
      - pdm_media_data:/app/data/media

networks:
  traefik-net:
    name: pdm_traefik_net
  db-net:
    name: pdm_db_net
    internal: true

volumes:
  traefik-data:
    name: pdm_traefik_data
  pdm_postgres_data:
    name: pdm_postgres_data
  pdm_media_data:
    name: pdm_media_data
